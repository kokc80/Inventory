[project]
name = "inventory"
version = "0.1.0"
description = "Инвентаризация ПК и офисного оборудования"
authors = [
    {name = "winuser",email = "kokc@inbox.ru"}
]
requires-python = ">=3.13"
dependencies = [
    "django (>=6.1.1,<7.0.0)",
    "djangorestframework (>=3.18.1,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "drf-yasg (>=1.21.15,<2.0.0)",
    "psycopg2 (>=2.9.13,<3.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
