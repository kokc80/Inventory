<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>АРМы</title>
</head>
<body>
    <h1>АРМы</h1>
    {% if workplaces %}
        <ul>
            {% for item in workplaces %}
                <li>
                    <a href="{% url 'workplace:wp_detail' item.pk %}">
                        {{ item.w_worker }}
                        ({{ item.w_office }} / {{ item.get_w_level_display }})
                    </a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>АРМы не описаны.</p>
    {% endif %}
</body>
</html>
